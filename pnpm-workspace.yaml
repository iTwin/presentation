packages:
  - apps/**
  - packages/*

allowBuilds:
  '@bentley/imodeljs-native': true
  '@parcel/watcher': false
  '@playwright/browser-chromium': true
  electron: true
  protobufjs: false
  unix-dgram: false

overrides:
  "@opentelemetry/otlp-transformer>protobufjs": ^8.0.2
  "uuid@<14": ^14.0.0

packageExtensions:
  'mocha-junit-reporter@*':
    peerDependenciesMeta:
      mocha:
        optional: true

autoInstallPeers: true

catalogs:
  appui:
    '@itwin/appui-react': ^5.33.3
    '@itwin/components-react': ^5.33.3
    '@itwin/core-react': ^5.33.3
    '@itwin/imodel-components-react': ^5.33.3
  build-tools:
    '@itwin/build-tools': ^5.12.5
    '@itwin/eslint-plugin': ^6.1.0
    '@types/node': ^24.13.3
    '@vitejs/plugin-react': ^6.1.1
    cpx2: ^7.0.2
    cross-env: ^7.0.3
    eslint: ^9.39.5
    eslint-plugin-react: ^7.37.5
    rimraf: ^6.1.3
    '@typescript/native': npm:typescript@~7.0.2
    typescript: npm:@typescript/typescript6@~6.0.2
    vite: ^8.2.2
  itwinjs-core:
    '@itwin/core-bentley': ^5.12.5
    '@itwin/core-common': ^5.12.5
    '@itwin/core-geometry': ^5.12.5
  itwinjs-core-dev:
    '@itwin/appui-abstract': ^5.12.5
    '@itwin/core-backend': ^5.12.5
    '@itwin/core-bentley': ^5.12.5
    '@itwin/core-common': ^5.12.5
    '@itwin/core-electron': ^5.12.5
    '@itwin/core-frontend': ^5.12.5
    '@itwin/core-geometry': ^5.12.5
    '@itwin/core-i18n': ^5.12.5
    '@itwin/core-orbitgt': ^5.12.5
    '@itwin/core-quantity': ^5.12.5
    '@itwin/ecschema-metadata': ^5.12.5
    '@itwin/ecschema-rpcinterface-common': ^5.12.5
    '@itwin/ecschema-rpcinterface-impl': ^5.12.5
    '@itwin/express-server': ^5.12.5
    '@itwin/presentation-backend': ^5.12.5
    '@itwin/presentation-common': ^5.12.5
    '@itwin/presentation-frontend': ^5.12.5
    inversify: ~6.0.2
    reflect-metadata: ^0.1.14
  itwinui:
    '@itwin/itwinui-icons-react': ^2.11.0
    '@itwin/itwinui-illustrations-react': ^2.1.0
    '@itwin/itwinui-react': ^3.21.3
  react:
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.5
    classnames: ^2.5.1
    react: ^19.2.8
    react-dom: ^19.2.8
    react-error-boundary: ^4.1.2
  rxjs:
    rxjs: ^7.8.2
    rxjs-for-await: ^1.0.0
  test-tools:
    '@testing-library/dom': ^10.4.1
    '@testing-library/react': ^16.3.3
    '@testing-library/user-event': ^14.6.6
    '@vitest/coverage-v8': ^4.1.11
    happy-dom: ^20.11.15
    vitest: ^4.1.11

hoistPattern:
  - '!*'
  - '@types/react'
  - '@typescript-eslint/types'
  - '*babel*'
  - ignore-styles
  - global-jsdom

onlyBuiltDependencies:
  - '@bentley/imodeljs-native'
  - electron
  - esbuild

peerDependencyRules:
  allowedVersions:
    react-table>react: "19"

resolutionMode: lowest-direct

strictPeerDependencies: true
