name: Content performance benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - apps/performance-tests/src/content/**
      - apps/performance-tests/src/util/**
      - apps/performance-tests/src/setup.ts
      - apps/performance-tests/package.json
      - apps/performance-tests/tsconfig.json
      - apps/performance-tests/vitest.config.ts
      - packages/content/**
      - packages/core-interop/**
      - packages/shared/**
      - packages/test-utilities/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/benchmark-content.yml

jobs:
  benchmark:
    name: 'Content: Benchmark performance'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build benchmark tests
        run: pnpm lage build --to presentation-performance-tests

      - name: Restore datasets from cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        id: cache-restore
        with:
          path: "./apps/performance-tests/datasets/*.bim"
          key: content-performance-test-dataset-${{ hashFiles('./apps/performance-tests/src/util/Datasets.ts', './apps/performance-tests/src/util/IModelUtilities.ts', './packages/test-utilities/src/test-utilities/IModelUtils.ts') }}

      - name: Run benchmark tests
        run: pnpm benchmark:content
        env:
          BENCHMARK_ITERATIONS: 3

      - name: Save generated datasets
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: "./apps/performance-tests/datasets/*.bim"
          key: content-performance-test-dataset-${{ hashFiles('./apps/performance-tests/src/util/Datasets.ts', './apps/performance-tests/src/util/IModelUtilities.ts', './packages/test-utilities/src/test-utilities/IModelUtils.ts') }}

      - name: Store benchmark result
        uses: JonasDov/github-action-benchmark@04d30c72aa7aad091b58aacbb6c182ebb2ecb6c0
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          name: Content benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: ./apps/performance-tests/content-benchmark.json
          github-token: ${{ secrets.IMJS_ADMIN_GH_TOKEN }}
          auto-push: true
